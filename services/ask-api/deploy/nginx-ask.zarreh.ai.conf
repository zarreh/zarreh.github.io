# /etc/nginx/sites-available/ask.zarreh.ai
# After `certbot --nginx -d ask.zarreh.ai`, certbot adds the TLS lines to this file.

limit_req_zone $binary_remote_addr zone=ask_api:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ask.zarreh.ai;

    client_max_body_size 16k;

    location = /healthz {
        proxy_pass http://127.0.0.1:8090/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /ask {
        limit_req zone=ask_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8090/ask;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: stream tokens as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        add_header X-Accel-Buffering no;
    }

    location / {
        return 404;
    }
}
