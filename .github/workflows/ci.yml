name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site — check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Formatting
        run: npm run format:check

      - name: Build (Astro + Pagefind)
        run: npm run build

      - name: Internal link check
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --no-progress --include-fragments --index-files index.html
            --root-dir ${{ github.workspace }}/dist
            --exclude-path dist/pagefind
            'dist/**/*.html'
          fail: true

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end & accessibility tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  external-links:
    name: External links (advisory)
    runs-on: ubuntu-latest
    needs: site
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress --max-retries 2 --timeout 20 --index-files index.html
            --accept '200..=299,429'
            --exclude 'linkedin\.com' --exclude 'researchgate\.net' --exclude 'medium\.com'
            --exclude 'scholar\.google\.com'
            --exclude 'doi\.org' --exclude 'googletagmanager' --exclude 'api\.web3forms\.com'
            --exclude '^https://zarreh\.ai/(?:$|about|experience|work|research|contact|writing|advisory|speaking|og/|rss|sitemap|press)'
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true

  ask-api:
    name: Ask API — lint, test, image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ask-api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Build container image
        run: docker build -t ask-api:ci .
